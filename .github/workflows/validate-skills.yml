name: Validate skills

on:
  pull_request:
  push:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node scripts/sync-skills.mjs --check
      - run: node .agents/skills/figma-variable-extract/scripts/test-figma-variable-extract.mjs
      - run: node .agents/skills/figma-codegen/scripts/test-compare-images.mjs
      - run: node .agents/skills/figma-codegen/scripts/test-validate-figma-code-map.mjs
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -B -X utf8 .agents/skills/impl-explainer/scripts/test-impl-explainer.py
