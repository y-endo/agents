# Generated by impl-explainer; values are filled by new_report.py. Do not edit by hand (keeps the look consistent).
site_name: "{{SITE_NAME}}"
docs_dir: docs
site_dir: site
use_directory_urls: false

theme:
  name: material
  language: ja
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え
  features:
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.highlight

plugins:
  - search:
      lang: ja
  - offline

hooks:
  - hooks/impl_explainer.py

extra_css:
  - assets/extra.css

extra:
  impl_explainer:
    repo_root: "{{REPO_ROOT}}"
    editor: "{{EDITOR}}"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.snippets:
      base_path:
        - "{{REPO_ROOT}}"
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

nav:
  - 概要と仮説の照合: index.md
  - 仕様と処理の流れ: flow.md
  - 設計とその理由: design.md
  - コード解説: code.md
  - レビューで見るべきこと: review.md
  - 運用で気にすること: operations.md
  - 想定質問: faq.md
  - 理解度チェック: quiz.md
  - 証拠: evidence.md
